plugins {
    id "me.champeau.jmh" version "0.7.2"
}

apply plugin: 'java'

dependencies {
  implementation project(':hollow')

  implementation 'org.openjdk.jmh:jmh-core:1.21'
  compileOnly 'org.openjdk.jmh:jmh-generator-annprocess:1.21'
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << '-XDignore.symbol.file'
}

jmh {
  duplicateClassesStrategy = DuplicatesStrategy.WARN
}

// Producer integrity-phase benchmark (not JMH — long, millions of records).
// e.g. ./gradlew :hollow-perf:producerIntegrityBenchmark -Precords=5000000 -PshardSize=33554432 -Pmode=both -PbenchHeap=24g
tasks.register('producerIntegrityBenchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs the producer integrity-phase benchmark (parallel per-shard checksum off vs on).'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.netflix.hollow.perf.producer.ProducerIntegrityBenchmark'
  maxHeapSize = (project.findProperty('benchHeap') ?: '16g')
  args = [
    (project.findProperty('records') ?: '5000000').toString(),
    (project.findProperty('shardSize') ?: '33554432').toString(),
    (project.findProperty('mode') ?: 'both').toString()
  ]
}
